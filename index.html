<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; }
</style>
</head>
<body>
<script>
function loadScript(src, cb) {
  var s = document.createElement('script');
  s.src = src;
  s.onload = cb;
  document.head.appendChild(s);
}
loadScript('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js', function () {
loadScript('https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js', function () {
loadScript('https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/DRACOLoader.js', function () {

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xffffff);

  var camera = new THREE.PerspectiveCamera(
    85,
    window.innerWidth / window.innerHeight,
    0.001,
    5000
  );

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 2));
  var dl = new THREE.DirectionalLight(0xffffff, 1.5);
  dl.position.set(5, 10, 5);
  scene.add(dl);

  var dracoLoader = new THREE.DRACOLoader();
  dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128/examples/js/libs/draco/');

  var gltfLoader = new THREE.GLTFLoader();
  gltfLoader.setDRACOLoader(dracoLoader);

  var model = null;
  var lamp001 = null;
  var lamp002 = null;

  gltfLoader.load('https://cdn.jsdelivr.net/gh/hwrules189-commits/room@main/room10.glb', function(gltf) {
    model = gltf.scene;
    scene.add(model);

    model.traverse(function(obj) {
      if (obj.name === 'lamp001') lamp001 = obj;
      if (obj.name === 'lamp002') lamp002 = obj;
    });

    console.log('lamp001 found:', lamp001);
    console.log('lamp002 found:', lamp002);

    if (lamp001) lamp001.visible = true;
    if (lamp002) lamp002.visible = false;

    var box = new THREE.Box3().setFromObject(model);
    var center = box.getCenter(new THREE.Vector3());
    camera.position.set(center.x, center.y, center.z + 5);
    camera.lookAt(center);
  },
  function(xhr) {
    console.log('Loading: ' + (xhr.loaded / xhr.total * 100).toFixed(1) + '%');
  },
  function(err) {
    console.error('GLB load error:', err);
  });

  renderer.domElement.addEventListener('click', function (e) {
    if (!model) return;

    var raycaster = new THREE.Raycaster();
    var mouse = new THREE.Vector2();
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);

    var hits = raycaster.intersectObject(model, true);
    if (!hits.length) return;

    var obj = hits[0].object;
    while (obj && obj !== model) {
      if (obj.name === 'lamp001') {
        if (lamp001) lamp001.visible = false;
        if (lamp002) lamp002.visible = true;
        return;
      }
      if (obj.name === 'lamp002') {
        if (lamp002) lamp002.visible = false;
        if (lamp001) lamp001.visible = true;
        return;
      }
      obj = obj.parent;
    }
  });

  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

})})}); 
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; }
</style>
</head>
<body>

<script>
function loadScript(src, cb) {
  var s = document.createElement('script');
  s.src = src;
  s.onload = cb;
  document.head.appendChild(s);
}

loadScript('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js', function () {
loadScript('https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js', function () {
loadScript('https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/DRACOLoader.js', function () {

  // =====================
  // GLOBALS
  // =====================
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xffffff);

  var camera = new THREE.PerspectiveCamera(
    85,
    window.innerWidth / window.innerHeight,
    0.001,
    5000
  );

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 2));

  var dl = new THREE.DirectionalLight(0xffffff, 1.5);
  dl.position.set(5, 10, 5);
  scene.add(dl);

  var dracoLoader = new THREE.DRACOLoader();
  dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128/examples/js/libs/draco/');

  var gltfLoader = new THREE.GLTFLoader();
  gltfLoader.setDRACOLoader(dracoLoader);

  var model = null;
  var lamp1 = null;
  var lamp2 = null;

  // =====================
  // LOAD ROOM
  // =====================
  function loadRoom(url) {

    gltfLoader.load(url, function(gltf) {

      model = gltf.scene;
      scene.add(model);

      lamp1 = null;
      lamp2 = null;

      model.traverse(function(obj) {
        if (obj.name === "lamp1") lamp1 = obj;
        if (obj.name === "lamp2") lamp2 = obj;
      });

      // initial state
      if (lamp1) lamp1.visible = true;
      if (lamp2) lamp2.visible = false;

      // center camera
      var box = new THREE.Box3().setFromObject(model);
      var center = box.getCenter(new THREE.Vector3());

      camera.position.set(center.x, center.y, center.z + 5);
      camera.lookAt(center);

    });

  }

  loadRoom('https://cdn.jsdelivr.net/gh/hwrules189-commits/room@main/room10.glb');

  // =====================
  // CLICK HANDLER
  // =====================
  renderer.domElement.addEventListener('click', function (e) {

    if (!model) return;

    var raycaster = new THREE.Raycaster();
    var mouse = new THREE.Vector2();

    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);

    var hits = raycaster.intersectObject(model, true);
    if (!hits.length) return;

    var obj = hits[0].object;

    while (obj) {

      if (obj.name === "lamp1") {
        console.log("lamp1 → lamp2");

        if (lamp1) lamp1.visible = false;
        if (lamp2) lamp2.visible = true;

        return;
      }

      if (obj.name === "lamp2") {
        console.log("lamp2 → lamp1");

        if (lamp2) lamp2.visible = false;
        if (lamp1) lamp1.visible = true;

        return;
      }

      obj = obj.parent;
    }

  });

  // =====================
  // ANIMATE LOOP
  // =====================
  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }

  animate();

  // =====================
  // RESIZE
  // =====================
  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

})})});
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #fff; display: flex; align-items: center; justify-content: center; }
canvas { display: block; }
</style>
</head>
<body>
<script>
function loadScript(src, cb) {
  var s = document.createElement('script');
  s.src = src;
  s.onload = cb;
  document.head.appendChild(s);
}
loadScript('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js', function() {
loadScript('https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js', function() {
loadScript('https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/DRACOLoader.js', function() {

  var dracoLoader = new THREE.DRACOLoader();
  dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128/examples/js/libs/draco/');
  var gltfLoader = new THREE.GLTFLoader();
  gltfLoader.setDRACOLoader(dracoLoader);

  var W = 600;
  var H = 800;

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xffffff);
  var camera = new THREE.PerspectiveCamera(85, W / H, 0.001, 5000);

  scene.add(new THREE.AmbientLight(0xffffff, 1));
  var dl = new THREE.DirectionalLight(0xffffff, 1);
  dl.position.set(5, 10, 5);
  scene.add(dl);
  var dl2 = new THREE.DirectionalLight(0xffffff, 0.5);
  dl2.position.set(-5, 5, -5);
  scene.add(dl2);

  var boneHelpers = [];
  var selectedBone = null;
  var isDraggingBone = false;
  var lastMouse = new THREE.Vector2();

  gltfLoader.load('https://raw.githubusercontent.com/hwrules189-commits/room/main/wrestlerpuppet.glb', function(gltf) {
    var model = gltf.scene;

    var boxRaw = new THREE.Box3().setFromObject(model);
    var sizeRaw = boxRaw.getSize(new THREE.Vector3());
    var maxDimRaw = Math.max(sizeRaw.x, sizeRaw.y, sizeRaw.z);
    var scaleFactor = 38 / maxDimRaw;
    model.scale.setScalar(scaleFactor);
    scene.add(model);

    var box = new THREE.Box3().setFromObject(model);
    var center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);

    box = new THREE.Box3().setFromObject(model);
    var size = box.getSize(new THREE.Vector3());
    var maxDim = Math.max(size.x, size.y, size.z);

    camera.position.set(0, 0, maxDim * 2);
    camera.lookAt(0, 0, 0);

    model.traverse(function(obj) {
      if (obj.isBone) {
        if (obj.name === 'neutral_bone' || obj.name === 'Bone009' || obj.name === 'Bone012') return;
        if (obj.name.toLowerCase().indexOf('root') !== -1) return;
        var wp = new THREE.Vector3();
        obj.getWorldPosition(wp);
        var geo = new THREE.SphereGeometry(0.12, 8, 8);
        var mat = new THREE.MeshBasicMaterial({ color: 0x00ccff, depthTest: false, transparent: true, opacity: 0.9 });
        var sphere = new THREE.Mesh(geo, mat);
        sphere.userData.bone = obj;
        sphere.renderOrder = 999;
        sphere.position.copy(wp);
        scene.add(sphere);
        boneHelpers.push(sphere);
      }
    });

    console.log('Bones:', boneHelpers.length);
  }, null, function(err) { console.error(err); });

  renderer.domElement.addEventListener('pointerdown', function(e) {
    var rect = renderer.domElement.getBoundingClientRect();
    var mouse = new THREE.Vector2();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    var raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(mouse, camera);
    var intersects = raycaster.intersectObjects(boneHelpers, false);
    console.log('Bone intersects:', intersects.length);
    if (intersects.length > 0) {
      selectedBone = intersects[0].object.userData.bone;
      boneHelpers.forEach(function(h) { h.material.color.set(0x00ccff); });
      intersects[0].object.material.color.set(0xff6600);
      isDraggingBone = true;
      lastMouse.set(e.clientX, e.clientY);
      renderer.domElement.setPointerCapture(e.pointerId);
    }
  });

  renderer.domElement.addEventListener('pointermove', function(e) {
    if (!isDraggingBone || !selectedBone) return;
    var dx = (e.clientX - lastMouse.x) * 0.008;
    var dy = (e.clientY - lastMouse.y) * 0.008;
    selectedBone.rotation.z -= dx;
    selectedBone.rotation.x += dy;
    selectedBone.updateMatrix();
    lastMouse.set(e.clientX, e.clientY);
  });

  renderer.domElement.addEventListener('pointerup', function(e) {
    isDraggingBone = false;
    selectedBone = null;
    renderer.domElement.releasePointerCapture(e.pointerId);
  });

  function animate() {
    requestAnimationFrame(animate);
    if (boneHelpers.length > 0) {
      boneHelpers.forEach(function(sphere) {
        var wp = new THREE.Vector3();
        sphere.userData.bone.getWorldPosition(wp);
        sphere.position.copy(wp);
      });
    }
    renderer.render(scene, camera);
  }
  animate();

})})});
</script>
</body>
</html>

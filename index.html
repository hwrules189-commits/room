<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
</style>
</head>
<body>
<div id="videoOverlay" style="
  position:fixed;
  inset:0;
  z-index:9999;
  cursor:pointer;
  display:flex;
  background:rgba(255,255,255);
  justify-content:center;
  align-items:center;
">

  <video
    id="introVideo"
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline
    style="
      width:500px;
      max-width:90%;
      
      box-shadow:0 0 40px rgba(0,0,0,0.6);
    ">
    <source src="https://hwrules189-commits.github.io/room/click.mp4" type="video/mp4">
  </video>

  <div style="
    position:absolute;
    bottom:60px;
    color:white;
    font-size:32px;
    font-family:sans-serif;
    font-weight:bold;
    text-shadow:0 0 20px black;
  ">
   
  

</div>
  
  <div id="photoOverlay" style="
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:100;
">
  <img id="overlayImg" src="" style="max-width:90%; max-height:90%;">
</div>

<script>
function loadScript(src, cb) {
  var s = document.createElement('script');
  s.src = src;
  s.onload = cb;
  document.head.appendChild(s);
}
loadScript('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js', function() {
loadScript('https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/GLTFLoader.js', function() {
loadScript('https://cdn.jsdelivr.net/npm/three@0.128/examples/js/loaders/DRACOLoader.js', function() {

  var dracoLoader = new THREE.DRACOLoader();
  dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128/examples/js/libs/draco/');
  var gltfLoader = new THREE.GLTFLoader();
  gltfLoader.setDRACOLoader(dracoLoader);

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.3;
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xffffff);
  var camera = new THREE.PerspectiveCamera(85, window.innerWidth / window.innerHeight, 0.001, 5000);
  scene.add(new THREE.AmbientLight(0xffffff, 2));
  var dl = new THREE.DirectionalLight(0xffffff, 1.5);
  dl.position.set(5, 10, 5);
  scene.add(dl);

  renderer.domElement.addEventListener('dblclick', function(e) { e.stopPropagation(); e.preventDefault(); }, true);
  renderer.domElement.addEventListener('contextmenu', function(e) { e.preventDefault(); });

  var mixer = null;
  var doorAction = null;
var doorOpen = false;
  var clock = new THREE.Clock();
  var currentRoom = 'room11';
  var SPEED = 0.05;

  var isDraggingCamera = false;
  var lastCamMouse = new THREE.Vector2();
  var camYaw = 0;
  var camPitch = 0;
  var mouseHasMoved = false;

  var lamp001 = null;
  var lamp002 = null;
  var lampHitbox = null;
  var lampOn = true;

 var photoTargets = {
  "dancing_lady": "https://raw.githubusercontent.com/hwrules189-commits/room/main/dancinglady.png",
  "handshake": "https://raw.githubusercontent.com/hwrules189-commits/room/main/handshake.png",
  "angel": "https://raw.githubusercontent.com/hwrules189-commits/room/main/angel.png",
  "amish": "https://raw.githubusercontent.com/hwrules189-commits/room/main/amish.png",
  "antiaging": "https://raw.githubusercontent.com/hwrules189-commits/room/main/antiaging.png"

  
  
};

  var cerealMesh = null;
  var cerealVisible = false;
  var cerealVideo = null;
  var cerealTextureApplied = false;

  var dinosaurMesh = null;
var dinosaurVisible = false;

  var dinosaurVideo = null;
var dinosaurTextureApplied = false;

  function toggleCereal() {
    if (!cerealMesh) return;
    cerealVisible = !cerealVisible;
    cerealMesh.visible = cerealVisible;

    if (cerealVisible) {
      if (!cerealTextureApplied && cerealVideo) {
        cerealTextureApplied = true;
        var videoTexture = new THREE.VideoTexture(cerealVideo);
        videoTexture.flipY = false;
        videoTexture.encoding = THREE.sRGBEncoding;
        cerealMesh.material = new THREE.MeshBasicMaterial({
          map: videoTexture,
          side: THREE.DoubleSide
        });
      }
      if (cerealVideo) {
        if (cerealVideo.readyState >= 2) {
          cerealVideo.play();
        } else {
          cerealVideo.addEventListener('canplay', function handler() {
            cerealVideo.removeEventListener('canplay', handler);
            cerealVideo.play();
          });
        }
      }
    } else {
      if (cerealVideo) cerealVideo.pause();
    }
  }
  function showPhoto(src) {
  document.getElementById('overlayImg').src = src;
  document.getElementById('photoOverlay').style.display = 'flex';
}

function hidePhoto() {
  document.getElementById('photoOverlay').style.display = 'none';
}

document.getElementById('photoOverlay').addEventListener('click', hidePhoto);

           
 function toggleDinosaur() {
  if (!dinosaurMesh) return;
  dinosaurVisible = !dinosaurVisible;
  dinosaurMesh.visible = dinosaurVisible;

  if (dinosaurVisible) {
    if (!dinosaurTextureApplied && dinosaurVideo) {
      dinosaurTextureApplied = true;
      var videoTexture = new THREE.VideoTexture(dinosaurVideo);
      videoTexture.flipY = false;
      videoTexture.encoding = THREE.sRGBEncoding;
      dinosaurMesh.material = new THREE.MeshBasicMaterial({
        map: videoTexture,
        side: THREE.DoubleSide
      });
    }
    if (dinosaurVideo) {
      if (dinosaurVideo.readyState >= 2) {
        dinosaurVideo.play();
      } else {
        dinosaurVideo.addEventListener('canplay', function handler() {
          dinosaurVideo.removeEventListener('canplay', handler);
          dinosaurVideo.play();
        });
      }
    }
  } else {
    if (dinosaurVideo) dinosaurVideo.pause();
  }
}

  function loadRoom(glbUrl) {
    currentRoom = 'room11';
    var toRemove = [];
    scene.traverse(function(obj) { if (!obj.isScene) toRemove.push(obj); });
    toRemove.forEach(function(obj) { scene.remove(obj); });
    scene.add(new THREE.AmbientLight(0xffffff, 2));
    var dl2 = new THREE.DirectionalLight(0xffffff, 1.5);
    dl2.position.set(5, 10, 5);
    scene.add(dl2);
    if (mixer) { mixer.stopAllAction(); mixer = null; }
    lamp001 = null;
    lamp002 = null;
    cerealMesh = null;
    cerealVisible = false;
    cerealVideo = null;
    cerealTextureApplied = false;
    dinosaurMesh = null;
dinosaurVisible = false;
    dinosaurVideo = null;
dinosaurTextureApplied = false;

    gltfLoader.load(glbUrl, function(gltf) {
      var model = gltf.scene;
      gltf.scene.traverse(function(obj) { console.log(obj.type, obj.name); });
      model.scale.setScalar(10);

      gltf.scene.traverse(function(obj) {
        if (obj.name === 'Empty') obj.scale.set(0.011, 0.011, 0.011);
        if (obj.name === 'lamp001') lamp001 = obj;
        if (obj.name === 'lamp002') lamp002 = obj;
        if (obj.name === 'dinosaur001') {
  dinosaurMesh = obj;
  obj.visible = false;
           dinosaurVideo = document.createElement('video');
  dinosaurVideo.loop = true;
  dinosaurVideo.muted = true;
  dinosaurVideo.playsInline = true;
  fetch('https://hwrules189-commits.github.io/room/dinosaur.mp4')
    .then(function(r) { return r.blob(); })
    .then(function(blob) { dinosaurVideo.src = URL.createObjectURL(blob); });

}
        if (obj.name === 'me_eating_cereal_') {
          cerealMesh = obj;
          obj.visible = false;
          cerealVideo = document.createElement('video');
          cerealVideo.loop = true;
          cerealVideo.muted = true;
          cerealVideo.playsInline = true;
          fetch('https://hwrules189-commits.github.io/room/cereal.mp4')
            .then(function(r) { return r.blob(); })
            .then(function(blob) { cerealVideo.src = URL.createObjectURL(blob); });
        }
      });

      scene.add(model);
      model.traverse(function(obj) {
  if (obj.isMesh) {
    obj.frustumCulled = false;
    if (obj.material && obj.material.transparent === false) {
        obj.renderOrder = 0;
      }
    }
  });


      if (lamp001) lamp001.visible = true;
      if (lamp002) lamp002.visible = false;

      if (lamp001 && lamp002) {
        var b1 = new THREE.Box3().setFromObject(lamp001);
        var b2 = new THREE.Box3().setFromObject(lamp002);
        var combined = b1.union(b2);
        var hSize = combined.getSize(new THREE.Vector3());
        var hCenter = combined.getCenter(new THREE.Vector3());
        lampHitbox = new THREE.Mesh(
          new THREE.BoxGeometry(hSize.x, hSize.y, hSize.z),
          new THREE.MeshBasicMaterial({ visible: false })
        );
        lampHitbox.position.copy(hCenter);
        scene.add(lampHitbox);
      }

    if (gltf.animations.length > 0) {
  mixer = new THREE.AnimationMixer(gltf.scene);

  gltf.animations.forEach(function(clip) {
    console.log('ANIMATION:', clip.name);
    clip.tracks.forEach(function(track) {
      console.log('TRACK:', track.name);
    });

    if (
      clip.name.toLowerCase().includes('door') ||
      clip.name.toLowerCase().includes('closet')
    ) {
      var filteredTracks = clip.tracks.filter(function(track) {
        var trackObjName = track.name.split('.')[0];
        if (trackObjName !== 'door_closet_right') return false;
        if (track.name.endsWith('.position')) {
          var initialY = track.values[1];
          for (var i = 1; i < track.values.length; i += 3) {
            track.values[i] = initialY;
          }
        }
        return true;
      });

      var filteredClip = new THREE.AnimationClip(clip.name, clip.duration, filteredTracks);
      doorAction = mixer.clipAction(filteredClip);
      doorAction.clampWhenFinished = true;
      doorAction.loop = THREE.LoopOnce;
    }
  });
}

      var box = new THREE.Box3().setFromObject(model);
      var center = box.getCenter(new THREE.Vector3());
      var size = box.getSize(new THREE.Vector3());
      camera.position.set(center.x, center.y, center.z);
      camera.lookAt(center.x + 0.01, center.y, center.z - 0.01);
      SPEED = size.x * 0.01;
    }, null, function(err) { console.error(err); });
  }

  function loadPuppet() {
    var toRemove = [];
    scene.traverse(function(obj) { if (!obj.isScene) toRemove.push(obj); });
    toRemove.forEach(function(obj) { scene.remove(obj); });
    if (mixer) { mixer.stopAllAction(); mixer = null; }

    var iframe = document.createElement('iframe');
    iframe.src = 'https://hwrules189-commits.github.io/room/puppet.html';
    iframe.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;border:none;z-index:50;';
    document.body.appendChild(iframe);
  }

loadRoom('https://raw.githubusercontent.com/hwrules189-commits/room/main/room11.glb');

document.getElementById('videoOverlay').addEventListener('click', function () {

  document.getElementById('videoOverlay').style.display = 'none';

  var video = document.getElementById('introVideo');

  if (video) video.pause();



});

  renderer.domElement.addEventListener('click', function(e) {
    if (currentRoom !== 'room11') return;
    if (mouseHasMoved) return;

    var raycaster = new THREE.Raycaster();
    var mouse = new THREE.Vector2();
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    var all = [];
scene.traverse(function(obj) { if (obj.isMesh && obj.visible) all.push(obj); });
    var intersects = raycaster.intersectObjects(all, true);
    if (intersects.length === 0) return;

    var hit = intersects[0].object;
    // PHOTO OVERLAY SYSTEM (separate from everything else)
var objPhoto = hit;
while (objPhoto) {
  if (photoTargets[objPhoto.name]) {
    showPhoto(photoTargets[objPhoto.name]);
    return;
  }
  objPhoto = objPhoto.parent;
}

console.log('clicked:', hit.name, 'parents:', hit.parent && hit.parent.name, hit.parent && hit.parent.parent && hit.parent.parent.name);
    var isLamp001 = lamp001 && (hit === lamp001 || lamp001.getObjectById(hit.id));
    var isLamp002 = lamp002 && (hit === lamp002 || lamp002.getObjectById(hit.id));
    if (hit === lampHitbox || isLamp001 || isLamp002) {
      lampOn = !lampOn;
      if (lamp001) lamp001.visible = lampOn;
      if (lamp002) lamp002.visible = !lampOn;
      return;
    }

    

    

    var obj = hit;
    while (obj) {
      if (obj.name === 'mesh001') {
        toggleCereal();
        return;
      }
      obj = obj.parent;
    }

    var obj2 = hit;
    while (obj2) {
      if (obj2.name === 'Mesh_0' || obj2.name === 'Mesh_0.005') {
        currentRoom = 'puppet';
        loadPuppet();
        return;
      }
      obj2 = obj2.parent;
    }
// CLOSET DOOR CLICK
var doorObj = hit;

while (doorObj) {

  if (doorObj.name === 'door_closet_right') {

    if (doorAction) {

      if (!doorOpen) {
        doorAction.reset();
        doorAction.timeScale = 1;
        doorAction.play();
      } else {
        doorAction.paused = false;
        doorAction.timeScale = -1;
        doorAction.play();
      }

      doorOpen = !doorOpen;

    }

    return;
  }

  doorObj = doorObj.parent;
}
    var obj3 = hit;
while (obj3) {
  if (obj3.name === 'dinosaur' || obj3.name === 'dinosaur001') {
    toggleDinosaur();
    return;
  }
  obj3 = obj3.parent;
}
  });
var mouseDownPos = new THREE.Vector2();
  var DRAG_THRESHOLD = 4; // pixels
renderer.domElement.addEventListener('mousedown', function(e) {
isDraggingCamera = true;
mouseHasMoved = false;
  mouseDownPos.set(e.clientX, e.clientY);
    lastCamMouse.set(e.clientX, e.clientY);
  });

  renderer.domElement.addEventListener('mousemove', function(e) {
  if (!isDraggingCamera) return;
  var dx = (e.clientX - lastCamMouse.x) * 0.005;
  var dy = (e.clientY - lastCamMouse.y) * 0.005;
  // Compare total distance from where mouse originally went down
  var pxDx = e.clientX - mouseDownPos.x;
  var pxDy = e.clientY - mouseDownPos.y;
  if (Math.abs(pxDx) > DRAG_THRESHOLD || Math.abs(pxDy) > DRAG_THRESHOLD) mouseHasMoved = true;
  camYaw -= dx;
  camPitch -= dy;
  camPitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camPitch));
  lastCamMouse.set(e.clientX, e.clientY); // still update lastCamMouse for smooth camera delta
});

  renderer.domElement.addEventListener('mouseup', function() { isDraggingCamera = false; });
  renderer.domElement.addEventListener('mouseleave', function() { isDraggingCamera = false; });

  var forward = new THREE.Vector3();
  var right = new THREE.Vector3();
  var keys = {};
  document.addEventListener('keydown', function(e) { keys[e.code] = true; });
  document.addEventListener('keyup', function(e) { keys[e.code] = false; });

  function animate() {
    requestAnimationFrame(animate);
    var delta = clock.getDelta();
    if (mixer) mixer.update(delta);

    camera.rotation.order = 'YXZ';
    camera.rotation.y = camYaw;
    camera.rotation.x = camPitch;

    if (keys['ArrowUp']||keys['KeyW']) { camera.getWorldDirection(forward); forward.y=0; forward.normalize().multiplyScalar(SPEED); camera.position.add(forward); }
    if (keys['ArrowDown']||keys['KeyS']) { camera.getWorldDirection(forward); forward.y=0; forward.normalize().multiplyScalar(-SPEED); camera.position.add(forward); }
    if (keys['ArrowLeft']||keys['KeyA']) { camera.getWorldDirection(forward); right.crossVectors(forward, camera.up).normalize().multiplyScalar(-SPEED); camera.position.add(right); }
    if (keys['ArrowRight']||keys['KeyD']) { camera.getWorldDirection(forward); right.crossVectors(forward, camera.up).normalize().multiplyScalar(SPEED); camera.position.add(right); }
if (cerealMesh && cerealMesh.visible && cerealMesh.material.map)
cerealMesh.material.map.needsUpdate = true;
if (dinosaurMesh && dinosaurMesh.visible && dinosaurMesh.material.map)
dinosaurMesh.material.map.needsUpdate = true;
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

})})});
</script>
</body>
</html>
